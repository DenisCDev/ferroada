[package]
name = "ferroada"
version = "0.3.0"
edition = "2021"

[dependencies]
pingora = { version = "0.8", features = ["proxy", "openssl"] }
async-trait = "0.1"
regex = "1"
once_cell = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
http = "1"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
