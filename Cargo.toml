[package]
name = "ferroada"
version = "0.6.0"
edition = "2021"

[workspace]
members = [".", "fuzz"]
default-members = ["."]
resolver = "2"

[dependencies]
pingora = { version = "=0.8.1", features = ["proxy", "openssl", "connection_filter"] }
pingora-load-balancing = { version = "=0.8.1", default-features = false, features = ["openssl"] }
async-trait = "0.1"
regex = "1"
once_cell = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
http = "1"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["net", "time", "io-util", "fs", "rt", "signal"] }
openssl = "0.10"
openssl-sys = "0.9"
openssl-probe = "0.1"
base64 = "0.22"
brotli = "9.0.0"
prost = "0.13"
prost-types = "0.13"
prost-reflect = "0.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
brotli = "9.0.0"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
h2 = "0.4"
http = "1"
pingora = { version = "=0.8.1", features = ["proxy", "openssl", "connection_filter"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "time", "io-util", "fs", "macros"] }
openssl = "0.10"
openssl-sys = "0.9"
base64 = "0.22"
