[package]
name = "ferroada"
version = "0.6.0"
edition = "2021"

[workspace]
members = [".", "fuzz"]
default-members = ["."]
resolver = "2"

[dependencies]
pingora = { version = "=0.8.1", features = ["proxy", "openssl", "connection_filter"] }
async-trait = "0.1"
regex = "1"
once_cell = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
http = "1"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["net", "time"] }
openssl = "0.10"
openssl-probe = "0.1"
