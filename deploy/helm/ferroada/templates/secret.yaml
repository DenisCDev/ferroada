{{- if not .Values.ferroada.existingSecret }}
{{- $token := required "ferroada.dashboardToken é obrigatório (ou ferroada.existingSecret). Gere com: openssl rand -hex 32" .Values.ferroada.dashboardToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ferroada.secretName" . }}
  labels:
    {{- include "ferroada.labels" . | nindent 4 }}
type: Opaque
stringData:
  DASHBOARD_TOKEN: {{ $token | quote }}
  {{- if .Values.ferroada.originSecret }}
  ORIGIN_SECRET: {{ .Values.ferroada.originSecret | quote }}
  {{- end }}
{{- end }}
