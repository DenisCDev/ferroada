{{- include "ferroada.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferroada.fullname" . }}
  labels:
    {{- include "ferroada.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ferroada.selectorLabels" . | nindent 4 }}
