# Produção com Caddy a terminar TLS. Não use junto com docker-compose.yml.
# Não use este Compose e o unit systemd ao mesmo tempo.
# O Ferroada não publica 80/443. Caddy é o único origin público.
# Dashboard só no loopback do anfitrião.
# Proxies confiáveis deste caminho: 172.28.0.2/32,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
# Corra a partir da raiz do repositório:
#   docker compose -f deploy/topologies/cdn-edge/docker-compose.caddy.yml --env-file deploy/topologies/cdn-edge/.env.caddy up -d --build

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.28.0.2
    restart: unless-stopped
    depends_on:
      - ferroada

  ferroada:
    image: ferroada:0.6.0
    build:
      context: ../../..
      dockerfile: Dockerfile
    env_file:
      - .env.caddy
    environment:
      DASHBOARD_BIND: "0.0.0.0"
      FORCE_HTTPS: "false"
    volumes:
      - ./ferroada.toml:/ferroada.toml:ro
    working_dir: /
    ports:
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: 172.28.0.3
      origin: {}
    depends_on:
      - app

  app:
    image: ${APP_IMAGE:-nginx:alpine}
    expose:
      - "8080"
    networks:
      - origin
    restart: unless-stopped


networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  origin:

volumes:
  caddy_data:
  caddy_config:
