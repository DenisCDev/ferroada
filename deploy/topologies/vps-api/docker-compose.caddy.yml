# Produção com Caddy a terminar TLS. Não use junto com docker-compose.yml.
# Não use este Compose e o unit systemd ao mesmo tempo.
# O Ferroada não publica 80/443. Caddy é o único origin público.
# Dashboard só no loopback do anfitrião.
# Proxies confiáveis deste caminho: 172.28.0.2/32
# Corra a partir da raiz do repositório:
#   docker compose -f deploy/topologies/vps-api/docker-compose.caddy.yml --env-file deploy/topologies/vps-api/.env.caddy up -d --build

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.28.0.2
    restart: unless-stopped
    depends_on:
      - ferroada

  ferroada:
    image: ferroada:0.6.0
    build:
      context: ../../..
      dockerfile: Dockerfile
    env_file:
      - .env.caddy
    environment:
      DASHBOARD_BIND: "0.0.0.0"
      FORCE_HTTPS: "false"
    volumes:
      - ./ferroada.toml:/ferroada.toml:ro
      - ferroada_spool:/var/lib/ferroada/spool
    working_dir: /
    ports:
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: 172.28.0.3
      origin: {}
    depends_on:
      - app

  app:
    image: ${APP_IMAGE:-nginx:alpine}
    expose:
      - "8080"
    networks:
      - origin
    restart: unless-stopped


networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  origin:

volumes:
  ferroada_spool:
  caddy_data:
  caddy_config:
