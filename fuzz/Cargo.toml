[package]
name = "ferroada-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferroada = { path = ".." }
httparse = "1"
h2 = "0.4"
http = "1"
once_cell = "1"
tokio = { version = "1", features = ["io-util", "rt"] }

[[bin]]
name = "waf"
path = "fuzz_targets/waf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dlp"
path = "fuzz_targets/dlp.rs"
test = false
doc = false
bench = false
